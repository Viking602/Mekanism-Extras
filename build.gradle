plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.modDevGradle
    alias libs.plugins.spotless
    alias libs.plugins.lombok
}

group = maven_group
boolean isSnapshot = System.getenv("SNAPSHOT")
version = "${mod_version}" + (isSnapshot ? "-SNAPSHOT" : "")
boolean isCI = System.getenv("CI") != null

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.named('jar', Jar) {
    archiveClassifier.set('render.1')
    manifest.attributes('Viking602-Transmitter-Rendering-Fix': '1')
}

sourceSets {
    // Include resources generated by data generators.
    main.resources {
        srcDir 'src/generated/resources'
    }

    client {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    test {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    extra {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    clientExtra {
        compileClasspath += client.output + extra.compileClasspath
        runtimeClasspath += client.output + client.runtimeClasspath + extra.runtimeClasspath
    }
}

configurations {
    // set these as unresolvable so we don't accidentally force all dependents to use them with us
    clientRuntimeOnly.canBeResolved = false
    extraRuntimeOnly.canBeResolved = false
    clientExtraRuntimeOnly.canBeResolved = false

    runtimeClasspath.extendsFrom localRuntime
    extraRuntimeClasspath.extendsFrom extraLocalRuntime
    clientRuntimeClasspath.extendsFrom clientLocalRuntime
    extraClientRuntimeClasspath.extendsFrom clientExtraLocalRuntime
}

apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/dependencies.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/spotless.gradle"


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:-removal"
    options.compilerArgs.addAll(["-Xmaxerrs", "1500"])
    options.compilerArgs << "-Aquiet=true" // Suppress mixin notes
}

lombok {
    version = "1.18.46"
}

sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    addModdingDependenciesTo(sourceSets.verification)
    mods { mekanism_extras_verification { sourceSet sourceSets.verification } }
    runs {
        integrationClient {
            client()
            sourceSet = sourceSets.verification
            gameDirectory = file('../test-mekaddons-fullpack-20261011')
            systemProperty('mekextras.verify.client', 'true')
            jvmArgument('-Xmx12G')
        }
        verifyServer {
            server()
            sourceSet = sourceSets.verification
            gameDirectory = file('../test-mekanismextras-server-20261011')
            programArguments.addAll('--nogui', '--world', 'world-extra')
            systemProperty('mekextras.verify', 'true')
        }
        verifyClient {
            client()
            sourceSet = sourceSets.verification
            gameDirectory = file('../test-mekanismextras-client-20261011')
            systemProperty('mekextras.verify.client', 'true')
            systemProperty('mekextras.verify.worldOnly', project.findProperty('worldOnly') ?: 'false')
        }
    }
}
