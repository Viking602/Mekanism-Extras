import groovy.json.JsonSlurper
def project02Artifacts = new JsonSlurper().parse(file('gradle/project02-dependencies.json'))
def localFiles = project02Artifacts.collect { file("gradle/project02-dependencies/${it.file}") }
dependencies {
    implementation files(localFiles)
    compileOnly(libs.jetbrains.annotations)
}
tasks.register('verifyProject02Dependencies') {
    inputs.files(localFiles)
    doLast {
        project02Artifacts.each { artifact ->
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(file("gradle/project02-dependencies/${artifact.file}").bytes).encodeHex().toString()
            if (actual != artifact.sha256) throw new GradleException("Dependency checksum mismatch: ${artifact.file}")
        }
    }
}
tasks.withType(JavaCompile).configureEach { dependsOn('verifyProject02Dependencies') }
// These optional integrations have no target-version API. Their source is retained.
sourceSets.main.java.exclude('com/jerry/mekextras/client/recipe_viewer/emi/**',
    'com/jerry/mekextras/mixin/client/recipe_viewer/emi/**',
    'com/jerry/mekextras/common/tile/factory/TileEntityExtraAlloyingFactory.java')
